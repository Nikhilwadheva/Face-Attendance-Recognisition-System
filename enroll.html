<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enroll Face</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f4f7f6; color:#123; }
    .wrap { max-width:900px; margin:32px auto; background:#fff; border-radius:14px; padding:24px; box-shadow:0 8px 26px rgba(0,0,0,0.08); }
    .row { display:flex; gap:12px; flex-wrap:wrap; margin:10px 0; }
    input, button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid #ccd7d3; }
    button { background:#0e7c67; color:#fff; border:none; cursor:pointer; }
    video, canvas { width:100%; max-height:420px; border-radius:10px; background:#0d1720; display:block; }
    .status { min-height:28px; font-weight:700; }
    .ok { color:#0e7c67; }
    .err { color:#a22; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Enroll a New Employee</h1>
    <div class="row">
      <input id="employeeCode" placeholder="Employee ID" maxlength="32">
      <input id="name" placeholder="Full name" maxlength="100">
      <button id="startBtn">Open Camera</button>
      <button id="captureBtn">Capture Sample</button>
    </div>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none"></canvas>
    <div id="status" class="status"></div>
    <div style="margin-top:16px;">
      <a href="/" style="color:#0e7c67; text-decoration:none;">Back to attendance</a>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const samples = [];

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;
        statusEl.textContent = 'Camera ready.';
        statusEl.className = 'ok';
      } catch (err) {
        statusEl.textContent = 'Camera access was denied.';
        statusEl.className = 'err';
      }
    }

    function captureSample() {
      if (!video.srcObject) {
        statusEl.textContent = 'Open the camera first.';
        statusEl.className = 'err';
        return;
      }
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      samples.push(canvas.toDataURL('image/jpeg', 0.9));
      statusEl.textContent = `Sample ${samples.length} captured.`;
      statusEl.className = 'ok';
    }

    document.getElementById('startBtn').addEventListener('click', startCamera);
    document.getElementById('captureBtn').addEventListener('click', captureSample);

    const submitBtn = document.createElement('button');
    submitBtn.textContent = 'Submit Enrollment';
    submitBtn.style.marginTop = '12px';
    submitBtn.addEventListener('click', async () => {
      const employeeCode = document.getElementById('employeeCode').value.trim();
      const name = document.getElementById('name').value.trim();
      if (!employeeCode || !name || samples.length < 3) {
        statusEl.textContent = 'Provide an ID, name, and at least 3 samples.';
        statusEl.className = 'err';
        return;
      }
      try {
        const response = await fetch('/api/enroll', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ employee_code: employeeCode, name, frames: samples })
        });
        const data = await response.json();
        if (response.ok) {
          statusEl.textContent = data.message || 'Enrollment complete.';
          statusEl.className = 'ok';
        } else {
          statusEl.textContent = data.error || 'Enrollment failed.';
          statusEl.className = 'err';
        }
      } catch (e) {
        statusEl.textContent = 'Request failed.';
        statusEl.className = 'err';
      }
    });
    document.body.appendChild(submitBtn);
  </script>
</body>
</html>
